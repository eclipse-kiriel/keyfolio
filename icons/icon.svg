<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="8"/>

  <!-- Glowing Keyboard Body -->
  <g filter="url(#glow)">
    <rect x="96" y="140" width="320" height="232" rx="36" fill="rgba(30, 41, 59, 0.9)" stroke="url(#keyGrad)" stroke-width="6"/>
  </g>

  <!-- Keycaps Row 1 -->
  <rect x="136" y="180" width="44" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="192" y="180" width="44" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="248" y="180" width="44" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="304" y="180" width="72" height="44" rx="10" fill="url(#keyGrad)"/>

  <!-- Keycaps Row 2 -->
  <rect x="136" y="236" width="60" height="44" rx="10" fill="url(#keyGrad)"/>
  <rect x="208" y="236" width="44" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="264" y="236" width="44" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="320" y="236" width="56" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Spacebar Row 3 -->
  <rect x="136" y="292" width="48" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="196" y="292" width="140" height="44" rx="10" fill="url(#keyGrad)"/>
  <rect x="348" y="292" width="28" height="44" rx="10" fill="#334155" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
</svg>
